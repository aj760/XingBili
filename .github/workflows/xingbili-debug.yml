name: XingBili Debug Build

on:
  push:
    branches: [mytvb-shell]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 2.0.22)"
        required: false
        default: "2.0.22"
      version_code:
        description: "Version code (int)"
        required: false
        default: "22"

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK 25.1.8937393 and CMake 3.22.1
        run: |
          sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK (4 ABIs)
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PversionName=${{ inputs.version_name }} \
            -PversionCode=${{ inputs.version_code }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/blbl-${{ inputs.version_name }}-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/blbl-latest-debug.apk
          md5sum dist/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xingbili-${{ inputs.version_name }}-debug
          path: dist/*.apk

      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          TAG="v${VERSION_NAME}-shell"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/blbl-${VERSION_NAME}-debug.apk --clobber
          else
            gh release create "$TAG" dist/blbl-${VERSION_NAME}-debug.apk \
              --title "XingBili ${VERSION_NAME} (MyTVB shell)" \
              --notes "1:1 MyTVB shell, XingBili update source retained. Debug build with 4 ABIs." \
              --target "$GITHUB_SHA"
          fi
